[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/syntheit/telmo"

[workspace.dependencies]
telmo-kit = { path = "crates/kit" }
telmo-speed = { path = "crates/speed" }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
insta = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
