[package]
name = "telmo-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
telmo-kit.workspace = true
ratatui.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
crossterm.workspace = true
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
unicode-width = "0.2"
nucleo-matcher = "0.3"
fend-core = "1"
plist = "1"

[dev-dependencies]
insta.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSArray", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSWorkspace", "NSRunningApplication"] }
